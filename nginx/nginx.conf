# nginx.conf — Kortex
# Домен: http://7877710-ee569251.twc1.net/

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── HTTP сервер (для домена без HTTPS) ──
    server {
        listen 80;
        server_name 7877710-ee569251.twc1.net;

        # Статика (загрузки)
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Проксирование на Spring Boot
        location / {
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Важные заголовки для WebSocket (если нужны)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Буферизация
            proxy_buffering off;
            proxy_cache off;
        }

        # Логи
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }

    server {
        listen 443 ssl;
        server_name 7877710-ee569251.twc1.net;

        # SSL сертификаты (если есть)
        ssl_certificate     /etc/letsencrypt/live/7877710-ee569251.twc1.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/7877710-ee569251.twc1.net/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 30d;
        }

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}