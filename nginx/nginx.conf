# nginx.conf — Kortex
# Домен: kortexdev.ru

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── HTTP сервер (для редиректа на HTTPS и certbot) ──
    server {
        listen 80;
        server_name kortexdev.ru www.kortexdev.ru;

        # Для certbot вебрут проверки
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Все остальные запросы редиректим на HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ── HTTPS сервер ──
    server {
        listen 443 ssl http2;
        server_name kortexdev.ru www.kortexdev.ru;

        # SSL сертификаты (будут созданы certbot)
        ssl_certificate     /etc/letsencrypt/live/kortexdev.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kortexdev.ru/privkey.pem;

        # Настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Безопасные заголовки
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Статика (загрузки)
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Проксирование на Spring Boot
        location / {
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  443;

            # WebSocket поддержка
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Буферизация
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
        }

        # Логи
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}