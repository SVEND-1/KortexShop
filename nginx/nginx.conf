events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Таймауты для загрузки файлов
    client_max_body_size 1024M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # ==================== HTTP SERVER (Port 80) ====================
    # Редирект с HTTP на HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name kortexdev.ru www.kortexdev.ru;

        # Перенаправляем все запросы на HTTPS
        return 301 https://$server_name$request_uri;

        # ===== HEALTH CHECK (работает и на HTTP) =====
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ==================== HTTPS SERVER (Port 443) ====================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name northernsquad.ru www.northernsquad.ru;

        # SSL сертификаты
        ssl_certificate /etc/nginx/ssl/kortexdev.crt;
        ssl_certificate_key /etc/nginx/ssl/kortexdev.key;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Корневая директория
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ===== СТАТИЧЕСКИЕ ФАЙЛЫ =====
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;

            # Кэширование
            expires 30d;
            add_header Cache-Control "public, immutable";

            # CORS для API
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }

        # ===== HEALTH CHECK =====
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ (Spring Boot) =====
        location / {
            proxy_pass http://app:8080;

            # Базовые заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket поддержка
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Оптимизация буферизации
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            proxy_temp_file_write_size 8k;

            # Отключаем кэширование для динамического контента
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ===== API ENDPOINTS =====
        location /api/ {
            proxy_pass http://app:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS для API
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ===== ЗАЩИТА СКРЫТЫХ ФАЙЛОВ =====
        location ~ /\.(env|git|svn|htaccess|htpasswd|bak|backup|swp|config|sql)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ===== СИСТЕМНЫЕ ФАЙЛЫ =====
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        location = /humans.txt {
            log_not_found off;
            access_log off;
        }

        # ===== ЛОГИРОВАНИЕ =====
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # ===== ОБРАБОТКА ОШИБОК =====
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ===== GZIP СЖАТИЕ =====
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json
            image/svg+xml;
    }
}