<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/productStyle.css">
    <title>О товаре - Онлайн магазин</title>
</head>

<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <a href="/" class="logo">Kortex marketplace</a>

            <form class="search-form">
                <div class="search-container">
                    <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                    <button type="submit" class="search-button">
                        <img src="images/findImg.png">
                    </button>
                </div>
            </form>

            <nav class="nav">
                <a href="/cart" class="nav-link">
                    <img src="images/cart-img.png" class="nav-icon">
                    Корзина
                </a>

                <a href="/profile" class="nav-link">
                    <img src="images/profile-img.png" class="nav-icon">
                    Профиль
                </a>

                <a href="/login" class="nav-link">
                    <img src="images/join-img.png" class="nav-icon">
                    Войти
                </a>
            </nav>
        </div>
    </div>
</header>

<main class="product-container">
    <div class="container">

        <a href="/" class="back-button">← Назад к каталогу</a>

        <div id="product-content" class="product-content">

            <div class="product-images">
                <div class="main-image">
                    <img id="mainImage" src="images/product-img.png" alt="Товар">
                </div>
            </div>

            <div class="product-info">

                <div class="product-header">
                    <h1 id="productTitle" class="product-title">Загрузка...</h1>
                    <div id="productCategory" class="product-category"></div>
                </div>

                <div class="product-price">
                    <span id="productPrice" class="current-price">0 ₽</span>
                </div>

                <div id="productStock" class="product-stock">
                    В наличии: —
                </div>

                <div class="product-description">
                    <h3>Описание</h3>
                    <p id="productDescription">Загрузка...</p>
                </div>

                <div class="product-meta">
                    <div class="meta-item">
                        <strong>Категория:</strong>
                        <span id="productCategoryFull">-</span>
                    </div>
                </div>

                <div class="product-actions">

                    <!-- Количество УДАЛЕНО -->

                    <button id="addToCartBtn" class="btn btn-primary btn-large">
                        🛒 Добавить в корзину
                    </button>

                    <div id="successMessage" class="success-message" style="display:none;">
                        Товар добавлен в корзину!
                    </div>

                    <div id="errorMessage" class="error-message" style="display:none;">
                        Ошибка
                    </div>

                </div>
            </div>
        </div>

        <div id="errorBlock" style="display:none; padding:40px; text-align:center;">
            <h2>Ошибка</h2>
            <p id="errorText">Не удалось загрузить товар</p>
            <button onclick="history.back()" class="btn">Назад</button>
        </div>

    </div>
</main>


<!-- ======= JS ======= -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
            showError("ID товара не указан");
            return;
        }

        loadProduct(id);
    });


    /* =====================
       ЗАГРУЗКА С BACKEND
    ===================== */
    async function loadProduct(id) {
        try {
            const res = await fetch(`/api/products/${id}`);

            if (!res.ok) throw new Error("Товар не найден");

            const product = await res.json();
            fillProduct(product);

        } catch (e) {
            console.error(e);
            showError("Не удалось загрузить товар");
        }
    }


    /* =====================
       ОТОБРАЖЕНИЕ ТОВАРА
    ===================== */
    function fillProduct(p) {

        document.getElementById("productTitle").textContent = p.name;
        document.getElementById("productCategory").textContent = p.category;
        document.getElementById("productCategoryFull").textContent = p.category;

        document.getElementById("productPrice").textContent = formatPrice(p.price);

        document.getElementById("productStock").textContent =
            `✓ В наличии: ${p.count} шт.`;

        document.getElementById("productDescription").textContent =
            p.description || "Описание отсутствует";

        document.getElementById("mainImage").src = "/uploads/images/" + p.image;

        // Количество удалено, просто добавляем товар
        initAddToCart(p.id);
    }


    /* =====================
       ДОБАВЛЕНИЕ В КОРЗИНУ
    ===================== */
    function initAddToCart(productId) {
        const btn = document.getElementById("addToCartBtn");

        btn.onclick = async () => {
            try {
                btn.disabled = true;

                const response = await fetch(`/api/carts/items?productId=${productId}`, {
                    method: "POST",
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error || "Ошибка при добавлении в корзину");
                }

                const s = document.getElementById("successMessage");
                s.style.display = "block";
                setTimeout(() => s.style.display = "none", 2000);

            } catch (e) {
                console.error(e);

                const err = document.getElementById("errorMessage");
                err.textContent = "❌ " + e.message;
                err.style.display = "block";
                setTimeout(() => err.style.display = "none", 3000);

            } finally {
                btn.disabled = false;
            }
        };
    }


    /* =====================
       ФОРМАТ ЦЕНЫ
    ===================== */
    function formatPrice(price) {
        return new Intl.NumberFormat("ru-RU", {
            style: "currency",
            currency: "RUB",
            minimumFractionDigits: 0
        }).format(price);
    }


    /* =====================
       ОШИБКА
    ===================== */
    function showError(msg) {
        document.getElementById("product-content").style.display = "none";

        document.getElementById("errorText").textContent = msg;
        document.getElementById("errorBlock").style.display = "block";
    }
</script>

</body>
</html>
