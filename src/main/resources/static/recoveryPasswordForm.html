<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/authStyle.css">
    <title>Вход в аккаунт</title>
</head>
<body>
    <!--Шапка страницы-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="mainForm.html" class="logo">Kortex marketplace</a>
                
                <form class="search-form">
                    <div class="search-container">
                        <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                        <button type="submit" class="search-button">
                            <img id="findImg" src="images/findImg.png" alt="Поиск">
                        </button>
                    </div>
                </form>

                <nav class="nav">
                    <a href="cartForm.html" class="nav-link">
                        <img src="images/cart-img.png" alt="Корзина" class="nav-icon">
                        Корзина
                    </a>

                    <a href="profile.html" class="nav-link">
                        <img src="images/profile-img.png" alt="Профиль" class="nav-icon profile-icon">
                        <span class="profile-text">Профиль</span>
                    </a>

                    <a href="loginForm.html" class="nav-link">
                        <img src="images/join-img.png" alt="Войти" class="nav-icon">
                        Войти
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Форма восстановления пароля -->
    <main class="auth-container">
        <div class="auth-form">
            <h2 class="registerH2">Восстановление пароля</h2>

            <form class="loginForm" id="recoveryPasswordForm">
                <label>Пароль</label>
                <input type="password" name="password" id="recoveryPassword" placeholder="Введите новый пароль" required>
                
                <label>Подтвердите пароль</label>
                <input type="password" name="confirmPassword" id="recoveryConfirmPassword" placeholder="Подтвердите новый пароль" required>
                
                <button type="button" id="continueBtn2" class="loginBtn">Сохранить новый пароль</button>
            </form>

            <div class="auth-links">
                <a href="loginForm.html" class="toLogin">Вернуться ко входу</a>
                <a href="mainForm.html" class="back-to-main">Вернуться на главную</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const continueBtn1 = document.getElementById('continueBtn2');
            
            continueBtn1.addEventListener('click', function() {
                

                console.log('Переходим на mainForm.html');
                
                
                window.location.href = 'mainForm.html';
            });
            
            // Обработка Enter
            emailInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    continueBtn1.click();
                }
            });
        });
    </script>
    <script src="javascript/authScript.js"></script>
    <script src="javascript/api-integration.js"></script>
</body>
</html>
