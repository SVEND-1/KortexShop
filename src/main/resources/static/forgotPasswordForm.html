<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/authStyle.css">
    <title>Восстановление пароля</title>
</head>
<body>
    <!--Шапка страницы-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Kortex marketplace</a>

                <form class="search-form" action="/search" method="GET">
                    <div class="search-container">
                        <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                        <button type="submit" class="search-button">
                            <img id="findImg" src="images/findImg.png" alt="Поиск">
                        </button>
                    </div>
                </form>

                <nav class="nav">
                    <a href="/cart" class="nav-link">
                        <img src="images/cart-img.png" alt="Корзина" class="nav-icon">
                        Корзина
                    </a>

                    <a href="/profile" class="nav-link">
                        <img src="images/profile-img.png" alt="Профиль" class="nav-icon profile-icon">
                        <span class="profile-text">Профиль</span>
                    </a>

                    <a href="/login" class="nav-link">
                        <img src="images/join-img.png" alt="Войти" class="nav-icon">
                        Войти
                    </a>
                </nav>
            </div>
        </div>
    </header>
    
    <!-- Форма восстановления пароля -->
    <main class="auth-container">
        <div class="auth-form">
            <h2 class="registerH2">Восстановление пароля</h2>

            <div class="loginForm" id="forgotPasswordForm">
                <label>Email</label>
                <input type="email" name="email" id="forgotPasswordEmail" placeholder="Введите почту" required>
                
                <button type="button" class="loginBtn" id="continueBtn">
                    Продолжить
                </button>
            </div>

            <div class="auth-links">
                <a href="loginForm.html" class="toLogin">Вспомнили пароль? Войти</a>
                <a href="mainForm.html" class="back-to-main">Вернуться на главную</a>
            </div>
        </div>
    </main>
    <script src="javascript/api-integration.js"></script>
    <script src="javascript/authScript.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const continueBtn = document.getElementById('continueBtn');
            const emailInput = document.getElementById('forgotPasswordEmail');
            
            continueBtn.addEventListener('click', function() {
                const email = emailInput.value;
                
                if (!email) {
                    alert('Введите email');
                    emailInput.focus();
                    return;
                }
                
                // Простая валидация email
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    alert('Введите нормальный email. Пример: user@example.com');
                    emailInput.focus();
                    return;
                }
                
                console.log('Переходим на codeFromEmailForm.html');
                
                // Переходим на страницу восстановления пароля
                window.location.href = 'codeFromEmailForm.html';
            });
            
            // Обработка Enter
            emailInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    continueBtn.click();
                }
            });
        });
    </script>
</body>
</html>
