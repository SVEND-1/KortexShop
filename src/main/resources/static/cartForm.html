<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/cartStyle.css">
</head>

<body>
    <!--Шапка страницы-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Kortex marketplace</a>

                <form class="search-form" action="/search" method="GET">
                    <div class="search-container">
                        <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                        <button type="submit" class="search-button">
                            <img id="findImg" src="images/findImg.png" alt="Поиск">
                        </button>
                    </div>
                </form>

                <nav class="nav">
                    <a href="/cart" class="nav-link">
                        <img src="images/cart-img.png" alt="Корзина" class="nav-icon">
                        Корзина
                    </a>

                    <a href="/profile" class="nav-link">
                        <img src="images/profile-img.png" alt="Профиль" class="nav-icon profile-icon">
                        <span class="profile-text">Профиль</span>
                    </a>

                    <a href="/login" class="nav-link">
                        <img src="images/join-img.png" alt="Войти" class="nav-icon">
                        Войти
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Основной контент корзины -->
    <main class="cart-container">
        <div class="container">
            <h1 class="cart-title">Корзина</h1>
            
            <!-- Блок пустой корзины -->
            <div id="emptyCart" class="empty-cart">
                <div class="empty-cart-icon">
                    <img src="images/empty-cart.svg" alt="Пустая корзина">
                </div>
                <h2>Ваша корзина пуста</h2>
                <p>Добавьте товары из каталога, чтобы сделать заказ</p>
                <a href="mainForm.html" class="btn btn-primary">Перейти на главную</a>
            </div>

            <!-- Блок с товарами -->
            <div id="cartWithItems" class="cart-with-items" style="display: none;">
                <div class="cart-content">
                    <!-- Список товаров -->
                    <div class="cart-items" id="cartItems">
                        <!-- Товары будут загружаться через JavaScript -->
                    </div>

                    <!-- Итоговая информация -->
                    <div class="cart-summary">
                        <div class="summary-card">
                            <h3>Ваш заказ</h3>
                            <div class="summary-row">
                                <span id="totalItemsText">Товары (0)</span>
                                <span id="totalPrice">0 ₽</span>
                            </div>
                            <div class="summary-row">
                                <span>Доставка</span>
                                <span>Бесплатно</span>
                            </div>
                            <div class="summary-total">
                                <span>Итого</span>
                                <span id="finalTotal">0 ₽</span>
                            </div>
                            
                            <!-- Форма оформления заказа -->
                            <form action="/checkout" method="POST">
                                <button type="submit" class="btn btn-primary checkout-btn" id="checkoutBtn">
                                    Перейти к оформлению
                                </button>
                            </form>
                            
                            <a href="mainForm.html" class="continue-shopping">Продолжить покупки</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="javascript/productManager.js"></script>
    <script src="javascript/imageUploader.js"></script>
    <script src="javascript/cartManager.js"></script>
    <script src="javascript/cartScript.js"></script>
</body>
</html>
