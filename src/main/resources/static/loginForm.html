<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/authStyle.css">
    <title>Вход в аккаунт</title>
    
</head>
<body>
    <!--Шапка страницы-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="mainForm.html" class="logo">Kortex marketplace</a>
                
                <form class="search-form">
                    <div class="search-container">
                        <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                        <button type="submit" class="search-button">
                            <img id="findImg" src="images/findImg.png" alt="Поиск">
                        </button>
                    </div>
                </form>

                <nav class="nav">
                    <a href="#" class="nav-link">
                        <img src="images/cart-img.png" alt="Корзина" class="nav-icon">
                        Корзина
                    </a>

                    <a href="profile.html" class="nav-link">
                        <img src="images/profile-img.png" alt="Профиль" class="nav-icon profile-icon">
                        <span class="profile-text">Профиль</span>
                    </a>

                    <a href="loginForm.html" class="nav-link">
                        <img src="images/join-img.png" alt="Войти" class="nav-icon">
                        Войти
                    </a>
                </nav>
            </div>
        </div>
    </header>
    

    <!-- Форма входа -->
    <main class="auth-container">
        <div class="auth-form">
            <h2 class="registerH2">Вход в аккаунт</h2>

            <form class="loginForm" action="/login" method="POST">
                

                <label>Email</label>
                <input type="email" name="email" placeholder="Почта" required>
                
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Пароль" required>
                
                <button type="submit" class="loginBtn">Войти</button>
            </form>

            <div class="auth-links">
                <a href="registerForm.html" class="toRegistration">Зарегистрироваться</a>
                <a href="forgotPasswordForm.html" class="forgotPassword">Забыли пароль?</a>
                <a href="mainForm.html" class="back-to-main">Вернуться на главную</a>
            </div>
        </div>
    </main>

    <script src="javascript/authScript.js"></script>
    <script src="javascript/api-integration.js"></script>
</body>
</html>
