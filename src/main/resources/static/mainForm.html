<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/catalogStyle.css">
    <title>Kortex</title>
</head>
<body>
    <!--Шапка страницы-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Kortex marketplace</a>
                
                <form class="search-form" action="/search" method="GET">
                    <div class="search-container">
                        <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                        <button type="submit" class="search-button">
                            <img id="findImg" src="images/findImg.png" alt="Поиск">
                        </button>
                    </div>
                </form>

                <nav class="nav">
                    <a href="/cart" class="nav-link">
                        <img src="images/cart-img.png" alt="Корзина" class="nav-icon">
                        Корзина
                    </a>

                    <a href="/profile" class="nav-link">
                        <img src="images/profile-img.png" alt="Профиль" class="nav-icon profile-icon">
                        <span class="profile-text">Профиль</span>
                    </a>

                    <a href="/login" class="nav-link">
                        <img src="images/join-img.png" alt="Войти" class="nav-icon">
                        Войти
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Основной контент главной страницы -->
    <main class="main-content">
        <div class="container">
            
            
            <!-- Каталог товаров -->
            <section class="catalog">
                <div class="catalog-header">
                    <h2 class="catalog-title">Каталог товаров</h2>
                    <div class="catalog-filters">
                        <select id="categoryFilter" class="filter-select">
                            <option value="">Все категории</option>
                        </select>
                        <select id="sortFilter" class="filter-select">
                            <option value="">Сортировка</option>
                            <option value="name">По названию</option>
                            <option value="price_asc">По цене (возр.)</option>
                            <option value="price_desc">По цене (убыв.)</option>
                        </select>
                    </div>
                </div>
                
                <div id="productsGrid" class="products-grid">
                    <!-- Товары будут загружены через JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <script src="javascript/productManager.js"></script>
    <script src="javascript/imageUploader.js"></script>
    <script src="javascript/cartManager.js"></script>
    <script src="javascript/mainFormScript.js"></script>
    <script src="javascript/productNavigation.js"></script>
    <script src="javascript/catalogScript.js"></script>
</body>
</html>
