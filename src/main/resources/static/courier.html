<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/mainFormStyle.css">
    <link rel="stylesheet" href="design/courierStyle.css">
    <title>Панель курьера</title>
</head>
<body>
    <!--Шапка страницы-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Kortex marketplace</a>

                <form class="search-form" action="/search" method="GET">
                    <div class="search-container">
                        <input id="search-input" type="text" class="search-input" placeholder="Поиск товаров...">
                        <button type="submit" class="search-button">
                            <img id="findImg" src="images/findImg.png" alt="Поиск">
                        </button>
                    </div>
                </form>

                <nav class="nav">
                    <a href="/cart" class="nav-link">
                        <img src="images/cart-img.png" alt="Корзина" class="nav-icon">
                        Корзина
                    </a>

                    <a href="/profile" class="nav-link">
                        <img src="images/profile-img.png" alt="Профиль" class="nav-icon profile-icon">
                        <span class="profile-text">Профиль</span>
                    </a>

                    <a href="/login" class="nav-link">
                        <img src="images/join-img.png" alt="Войти" class="nav-icon">
                        Войти
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Основной контент курьера -->
    <div class="courier-container">
        <div class="courier-header">
            <h1>Панель курьера</h1>
            <button class="btn btn-outline" onclick="loadOrders()">Обновить заказы</button>
        </div>
        
        <!-- Блок информации о курьере -->
        <div class="courier-info">
            <div class="courier-card">

                <div class="courier-details">
                    <h2 id="courierName">Иван Иванов</h2>
                    <p class="courier-role">Курьер службы доставки</p>
                    <div class="courier-stats">
                        <div class="stat-item">
                            <span class="stat-value" id="activeOrders">0</span>
                            <span class="stat-label">Активных</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="availableOrders">0</span>
                            <span class="stat-label">Доступных</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="totalOrders">0</span>
                            <span class="stat-label">Всего</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Фильтры заказов -->
        <div class="orders-filters">
            <div class="filter-buttons">

                <button type="button" class="filter-btn" onclick="setFilter('my')">
                    Мои заказы
                </button>
                <button type="button" class="filter-btn" onclick="setFilter('available')">
                    Доступные
                </button>
            </div>
        </div>

        <!-- Список заказов -->
        <div class="orders-list">
            <h3 id="ordersTitle">Все заказы</h3>
            
            <div class="orders-container" id="ordersContainer">
                <div class="loading">Загрузка заказов...</div>
            </div>
        </div>
    </div>

    <!-- Шаблон заказа -->
    <template id="orderTemplate">
        <div class="order-card" data-order-id="">
            <div class="order-header">
                <h4 class="order-number">Заказ #<span class="order-id"></span></h4>
                <span class="order-status pending">В обработке</span>
            </div>
            
            <div class="order-customer">
                <div class="customer-info">
                    <strong>Клиент:</strong>
                    <span class="customer-name">Не указан</span>
                </div>
                <div class="customer-info">
                    <strong>Телефон:</strong>
                    <span class="customer-phone">Не указан</span>
                </div>
                <div class="customer-info">
                    <strong>Адрес:</strong>
                    <span class="customer-address">Не указан</span>
                </div>
            </div>

            <div class="order-actions">
                <button type="button" class="btn btn-primary btn-small accept-btn" onclick="acceptOrder(this)">
                    Принять заказ
                </button>
                
                <button type="button" class="btn btn-secondary btn-small start-btn" onclick="startDelivery(this)" style="display: none;">
                    Начать доставку
                </button>
                
                <button type="button" class="btn btn-success btn-small complete-btn" onclick="completeOrder(this)" style="display: none;">
                    Завершить доставку
                </button>
                
                <button type="button" class="btn btn-outline btn-small" onclick="showOrderDetails(this)">
                    Подробнее
                </button>
            </div>
        </div>
    </template>

    <script src="javascript/courierScript.js"></script>
</body>
</html>
